site_name: TorBots Docs
site_description: Team-wide documentation for FRC Team 1197 TorBots
repo_url: https://github.com/FRC-Team-1197-Torbots/TorbotsDocs
repo_name: FRC-Team-1197-Torbots/TorbotsDocs

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Team:
    - Robot Design Philosophy: team/design-philosophy.md
    - New Member Onboarding: team/onboarding.md
    - Team Structure: team/team-structure.md
    - How a Build Season Runs: team/build-season.md
    - Workflow & Tools: team/workflow.md
  - Mechanical:
    - Overview: mechanical/index.md
    - Standards:
      - Power Transmission: mechanical/standards/power-transmission.md
      - Structure & Materials: mechanical/standards/structure-materials.md
      - Bearings & Retention: mechanical/standards/bearings.md
      - Linear Motion: mechanical/standards/linear-motion.md
      - Intakes: mechanical/standards/intakes.md
      - Shooters: mechanical/standards/shooters.md
      - 3D Printing: mechanical/standards/3d-printing.md
      - CAD: mechanical/standards/cad.md
  - Electrical:
    - Overview: electrical/index.md
    - Standards:
      - Connectors: electrical/standards/connectors.md
      - Power & CAN: electrical/standards/power-can.md
  - Programming: programming/index.md
  - Seasons:
    - Overview: seasons/index.md
    - "2027":
      - Season Plan: seasons/2027/plan.md
    - "2026":
      - Season Retro: seasons/2026/season.md
      - Off-Season Retro: seasons/2026/off-season.md
  - Resources: resources/links.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

plugins:
  - search
